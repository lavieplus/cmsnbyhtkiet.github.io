<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170d2b">
<title>Chúc mừng sinh nhật người em yêu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#170d2b; --plum:#2a1450; --rose:#ff7a9c; --gold:#ffd28a; --cream:#fff4e6; --mute:#c9b8e6;
  --hand:'Charm','Segoe Script','Brush Script MT',cursive;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--cream);font-family:var(--body);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% 0%,var(--plum) 0%,var(--night) 70%)}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:fixed;inset:0;z-index:1;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 28px;text-align:center;opacity:0;visibility:hidden;transform:translate3d(0,14px,0) scale(.98);
  transition:opacity .9s ease,transform .9s ease,visibility 0s .9s}
.scene.on{opacity:1;visibility:visible;transform:none;transition:opacity .9s ease .15s,transform .9s ease .15s,visibility 0s}
h1,h2{font-family:var(--hand);font-weight:700;margin:0;line-height:1.1}
.sub{color:var(--mute);font-weight:300;font-size:15px;line-height:1.7;margin:14px 0 0;max-width:30ch}
.btn{margin-top:26px;font:500 15px var(--body);color:var(--night);background:linear-gradient(135deg,var(--gold),var(--rose));
  border:0;border-radius:999px;padding:14px 28px;box-shadow:0 8px 28px rgba(255,122,156,.35);cursor:pointer;transition:transform .2s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1px rgba(255,244,230,.35)}
.btn:focus-visible,.mu:focus-visible,.heart:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* intro */
#s0 h1{font-size:clamp(34px,10vw,46px)}
.heart{position:relative;width:120px;height:120px;margin:34px 0 4px;background:none;border:0;padding:0;cursor:pointer}
.heart svg{width:100%;height:100%;filter:drop-shadow(0 0 18px rgba(255,122,156,.7));animation:beat 1.4s ease-in-out infinite}
.heart::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid var(--rose);opacity:0;animation:ring 2.4s ease-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.7);opacity:0}}

/* cake */
#s1 h2{font-size:clamp(28px,8vw,36px)}
.cake{width:min(78vw,320px);margin-top:12px;overflow:visible}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate;transition:opacity .35s,transform .35s}
.flame:nth-of-type(2){animation-delay:-.3s}.flame:nth-of-type(3){animation-delay:-.6s}
.glow{animation:flick 1.1s ease-in-out infinite alternate;transition:opacity .35s}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}100%{transform:scale(.9,1.12) rotate(2deg)}}
.out .flame,.out .glow{opacity:0;transform:scale(.3);animation:none}
.cdl{cursor:pointer}
#hint{min-height:48px;transition:opacity .5s}

/* letters */
#msg{font-family:var(--hand);font-size:clamp(27px,7.6vw,36px);line-height:1.35;max-width:16em;min-height:7.6em;
  display:flex;align-items:center;justify-content:center;transition:opacity .45s ease,transform .45s ease}
#msg.swap{opacity:0;transform:translate3d(0,14px,0)}
.dots{display:flex;gap:8px;margin-top:22px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,244,230,.25);transition:background .4s,transform .4s}
.dots i.a{background:var(--rose);transform:scale(1.4)}
.tap{margin-top:22px;font-size:13px;color:var(--mute);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* finale */
#s3 h1{font-size:clamp(40px,13vw,58px);color:var(--gold);text-shadow:0 0 30px rgba(255,210,138,.35)}
#s3 h1 span{display:inline-block;opacity:0;transform:translate3d(0,24px,0);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.9,.3,1.2)}
#s3.on h1 span{opacity:1;transform:none}
#nm{font-family:var(--hand);font-size:clamp(34px,11vw,48px);color:var(--rose);margin:6px 0 0;opacity:0;transition:opacity 1s ease 1.2s}
#s3.on #nm{opacity:1}
#fin{max-width:28ch;font-weight:300;font-size:15px;line-height:1.8;color:var(--cream);margin:18px 0 0;opacity:0;transition:opacity 1s ease 2s}
#s3.on #fin,#s3.on .row{opacity:1}
.row{display:flex;flex-direction:column;gap:2px;align-items:center;opacity:0;transition:opacity 1s ease 2.8s}

/* lanterns + music */
.lantern{position:fixed;bottom:-70px;width:34px;height:46px;z-index:2;pointer-events:none;border-radius:40% 40% 30% 30%;
  background:linear-gradient(#ffe2a8,#ff9a6a);box-shadow:0 0 26px 8px rgba(255,170,100,.55);will-change:transform,opacity;
  animation:rise var(--d,8s) ease-in forwards}
.lantern::after{content:"";position:absolute;left:25%;right:25%;bottom:-6px;height:6px;border-radius:0 0 4px 4px;background:#b5552f}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:1}100%{transform:translate3d(var(--x,20px),-115vh,0);opacity:0}}
.mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:5;width:42px;height:42px;border-radius:50%;
  border:0;background:rgba(255,255,255,.1);color:var(--cream);font-size:18px;cursor:pointer;backdrop-filter:blur(6px);display:none}
.mu.show{display:block}.mu.off{opacity:.45}
.wm{position:fixed;left:50%;top:50%;width:220vmax;transform:translate(-50%,-50%) rotate(-24deg);z-index:0;pointer-events:none;display:flex;flex-direction:column;gap:34px;opacity:.07}
.wm div{white-space:nowrap;font:500 15px var(--body);letter-spacing:6px;color:var(--cream)}
.wm div:nth-child(even){margin-left:-120px}
.cre{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:4;text-align:center;pointer-events:none;font:500 11px var(--body);letter-spacing:3px;color:var(--gold);opacity:.75;text-shadow:0 0 12px rgba(255,210,138,.5)}
@media (prefers-reduced-motion:reduce){.flame,.glow,.heart svg,.heart::after,.tap{animation:none}}
</style>
</head>
<body>
<div class="wm" aria-hidden="true" id="wm"></div>
<canvas id="bg"></canvas>
<div class="cre">BY HUỲNH TUẤN KIỆT</div>
<button class="mu" id="mu" aria-label="Bật hoặc tắt nhạc">♪</button>
<main>
  <section class="scene on" id="s0">
    <h1>Hôm nay là ngày<br>của <span data-n></span></h1>
    <button class="heart" id="open" aria-label="Chạm để mở quà">
      <svg viewBox="0 0 100 90"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb199"/><stop offset="1" stop-color="#ff4f7e"/></linearGradient></defs>
      <path d="M50 85C20 62 4 46 4 28 4 14 15 5 27 5c10 0 18 6 23 14C55 11 63 5 73 5c12 0 23 9 23 23 0 18-16 34-46 57z" fill="url(#g)"/></svg>
    </button>
    <p class="sub">Có một món quà nhỏ đang đợi.<br>Chạm vào trái tim để mở nhé.</p>
  </section>

  <section class="scene" id="s1">
    <h2>Ước một điều đi nào</h2>
    <svg class="cake" id="cake" viewBox="0 0 300 290" aria-label="Bánh sinh nhật ba cây nến">
      <ellipse cx="150" cy="262" rx="132" ry="14" fill="#000" opacity=".25"/>
      <rect x="26" y="196" width="248" height="62" rx="16" fill="#ff9db6"/>
      <path d="M26 212q14 18 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0 18 0v-14a16 16 0 0 0-16-16H42a16 16 0 0 0-16 16z" fill="#fff4e6"/>
      <rect x="62" y="136" width="176" height="64" rx="14" fill="#ff7a9c"/>
      <path d="M62 152q11 16 22 0t22 0 22 0 22 0 22 0 22 0 22 0 20 0v-4a14 14 0 0 0-14-12H76a14 14 0 0 0-14 12z" fill="#fff4e6"/>
      <circle cx="96" cy="232" r="5" fill="#ffd28a"/><circle cx="150" cy="238" r="5" fill="#ffd28a"/><circle cx="204" cy="232" r="5" fill="#ffd28a"/>
      <g class="cd" data-i="0"><rect x="106" y="98" width="9" height="40" rx="3" fill="#ffd28a"/>
        <circle class="glow" cx="110.5" cy="82" r="26" fill="#ffb347" opacity=".28"/>
        <path class="flame" d="M110.5 60c9 10 9 20 0 26-9-6-9-16 0-26z" fill="#ffe08a"/>
        <rect class="cdl" x="82" y="52" width="58" height="92" fill="transparent"/></g>
      <g class="cd" data-i="1"><rect x="145.5" y="92" width="9" height="46" rx="3" fill="#bfe9ff"/>
        <circle class="glow" cx="150" cy="76" r="26" fill="#ffb347" opacity=".28"/>
        <path class="flame" d="M150 54c9 10 9 20 0 26-9-6-9-16 0-26z" fill="#ffe08a"/>
        <rect class="cdl" x="121" y="46" width="58" height="92" fill="transparent"/></g>
      <g class="cd" data-i="2"><rect x="185" y="98" width="9" height="40" rx="3" fill="#ffd28a"/>
        <circle class="glow" cx="189.5" cy="82" r="26" fill="#ffb347" opacity=".28"/>
        <path class="flame" d="M189.5 60c9 10 9 20 0 26-9-6-9-16 0-26z" fill="#ffe08a"/>
        <rect class="cdl" x="161" y="52" width="58" height="92" fill="transparent"/></g>
    </svg>
    <p class="sub" id="hint">Nhắm mắt, ước một điều thật đẹp,<br>rồi chạm vào từng ngọn nến để thổi tắt.</p>
    <button class="btn ghost" id="blow">Thổi giúp em</button>
  </section>

  <section class="scene" id="s2">
    <div id="msg"></div>
    <div class="dots" id="dots"></div>
    <div class="tap" id="tap">chạm bất kỳ đâu để đọc tiếp</div>
  </section>

  <section class="scene" id="s3">
    <h1 id="t"></h1>
    <div id="nm"></div>
    <p id="fin"></p>
    <div class="row">
      <button class="btn" id="lan">Thả đèn ước nguyện</button>
      <button class="btn ghost" id="again">Xem lại từ đầu</button>
    </div>
  </section>
</main>

<script>
/* ====== CHỈNH Ở ĐÂY ====== */
const CFG={
  name:"em yêu",            // tên người ấy, ví dụ "Linh"
  from:"Anh",               // người gửi
  letters:[
    "Chúc mừng sinh nhật, {n}.",
    "Cảm ơn {n} vì đã sinh ra trên đời này, để anh có cơ hội gặp được em.",
    "Có em, những ngày bình thường nhất cũng trở nên đáng nhớ.",
    "Nụ cười của em là thứ anh muốn bảo vệ nhất, mỗi ngày.",
    "Khi em mệt, hãy nhớ rằng luôn có một người đứng ngay phía sau em.",
    "Anh không hứa một tương lai hoàn hảo. Anh chỉ hứa sẽ ở đây, đi cùng em từng bước.",
    "Tuổi mới, mong {n} bình an, thật nhiều niềm vui và mãi được yêu thương."
  ],
  final:"Anh yêu em hôm nay, ngày mai và tất cả những ngày sau nữa."
};
/* ========================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const N=CFG.name, fill=t=>t.replace(/\{n\}/g,N);
$$('[data-n]').forEach(e=>e.textContent=N);
$('#wm').innerHTML=Array.from({length:30},()=>'<div>'+'BY HUỲNH TUẤN KIỆT &nbsp;&nbsp; ♥ &nbsp;&nbsp; '.repeat(14)+'</div>').join('');
$('#nm').textContent=N;
$('#fin').innerHTML=CFG.final+'<br><br><span style="font-family:var(--hand);font-size:24px;color:var(--gold)">— '+CFG.from+', mãi yêu em</span>';
$('#t').innerHTML='Chúc mừng sinh nhật'.split(' ').map((w,i)=>'<span style="transition-delay:'+(.3+i*.25)+'s">'+w+'</span>').join(' ');

/* ---------- Canvas ---------- */
const cv=$('#bg'),cx=cv.getContext('2d');let W,H,stars=[],P=[];
const COL=['#ff7a9c','#ffd28a','#ffb199','#fff4e6','#c9a7ff','#8fd3ff'];
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6.28,s:Math.random()*1.5+.5}))}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
function add(p){if(P.length<450)P.push(p)}
function heartPath(s){cx.beginPath();cx.moveTo(0,s*.4);cx.bezierCurveTo(-s*1.1,-s*.2,-s*.55,-s*.95,0,-s*.4);cx.bezierCurveTo(s*.55,-s*.95,s*1.1,-s*.2,0,s*.4);cx.closePath()}
function hearts(x,y,n,spread){for(let i=0;i<n;i++)add({t:'h',x:x+rnd(-spread,spread),y,vx:rnd(-30,30),vy:rnd(-130,-60),life:0,max:rnd(2.2,3.6),s:rnd(6,15),c:COL[i%2],ph:rnd(0,6)})}
function burst(x,y,n=46){const c=COL[Math.floor(Math.random()*COL.length)],c2=COL[Math.floor(Math.random()*COL.length)];
  for(let i=0;i<n;i++){const a=i/n*6.283,v=rnd(90,230);add({t:'f',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rnd(.9,1.5),s:rnd(1.5,2.8),c:i%3?c:c2})}}
function confetti(n=70){for(let i=0;i<n;i++)add({t:'c',x:rnd(0,W),y:rnd(-H*.3,-10),vx:rnd(-25,25),vy:rnd(80,170),life:0,max:rnd(4,6),s:rnd(5,9),c:COL[i%COL.length],r:rnd(0,6),vr:rnd(-6,6)})}
function smoke(x,y){for(let i=0;i<6;i++)add({t:'k',x:x+rnd(-4,4),y,vx:rnd(-8,8),vy:rnd(-45,-25),life:0,max:rnd(1.2,1.8),s:rnd(4,8)})}
let last=performance.now(),amb=0,ambOn=false;
function loop(now){const dt=Math.min((now-last)/1000,.034);last=now;cx.clearRect(0,0,W,H);
  for(const s of stars){s.p+=s.s*dt;cx.globalAlpha=.35+.45*Math.sin(s.p)**2;cx.fillStyle='#fff4e6';cx.fillRect(s.x,s.y,s.r,s.r)}
  if(ambOn&&(amb-=dt)<0){amb=.45;hearts(rnd(0,W),H+10,1,0)}
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life+=dt;if(p.life>=p.max){P[i]=P[P.length-1];P.pop();continue}
    const k=p.life/p.max;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.t==='h'){p.x+=Math.sin(p.life*2+p.ph)*.5;cx.globalAlpha=Math.min(1,(1-k)*1.6);cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.scale(1+k*.2,1+k*.2);heartPath(p.s);cx.fill();cx.restore()}
    else if(p.t==='f'){p.vy+=140*dt;p.vx*=.985;p.vy*=.985;cx.globalAlpha=1-k;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill()}
    else if(p.t==='c'){p.r+=p.vr*dt;p.x+=Math.sin(p.life*3+p.r)*.6;cx.globalAlpha=k>.85?(1-k)/.15:1;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
    else{cx.globalAlpha=(1-k)*.35;cx.fillStyle='#d9cfee';cx.beginPath();cx.arc(p.x,p.y,p.s*(1+k*2),0,6.283);cx.fill()}}
  cx.globalAlpha=1;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{last=performance.now()});

/* ---------- Nhạc (Happy Birthday, tổng hợp bằng WebAudio) ---------- */
let AC,master,musicOn=false,timer;
const F={G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784};
const SONG=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
 ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]];
function playSong(){if(!musicOn)return;let t=AC.currentTime+.1;const b=.52;
  for(const [n,d] of SONG){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=F[n];
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d*b*.95);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d*b);t+=d*b}
  timer=setTimeout(playSong,(t-AC.currentTime+1.5)*1000)}
function setMusic(on){musicOn=on;$('#mu').classList.toggle('off',!on);clearTimeout(timer);
  if(on){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.12;master.connect(AC.destination)}
    AC.resume();playSong()}else if(master){master.gain.setTargetAtTime(0,AC.currentTime,.05);setTimeout(()=>master.gain.value=.12,300)}}
$('#mu').onclick=()=>setMusic(!musicOn);

/* ---------- Cảnh ---------- */
const scenes=$$('.scene');let cur=0,busy=false;
function go(n){cur=n;scenes.forEach((s,i)=>s.classList.toggle('on',i===n));ambOn=n===3;
  if(n===2)showLetter(0,true);
  if(n===3){burst(W*.3,H*.28);setTimeout(()=>burst(W*.72,H*.22),500);setTimeout(()=>burst(W*.5,H*.35,60),1000);confetti(80)}}

$('#open').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();hearts(r.left+60,r.top+60,14,40);
  $('#mu').classList.add('show');setMusic(true);go(1)};

/* nến */
let lit=3;
function blow(i){const g=$$('.cd')[i];if(g.classList.contains('out'))return;g.classList.add('out');
  const f=g.querySelector('.flame').getBoundingClientRect();smoke(f.left+f.width/2,f.top+f.height/2);
  if(--lit===0)celebrate()}
$$('.cd').forEach((g,i)=>g.addEventListener('click',()=>blow(i)));
$('#blow').onclick=()=>{[0,1,2].forEach((i,k)=>setTimeout(()=>blow(i),k*260));$('#blow').style.display='none'};
function celebrate(){$('#blow').style.display='none';
  $('#hint').innerHTML='Điều ước của em sẽ thành hiện thực.';
  const c=$('#cake').getBoundingClientRect();
  setTimeout(()=>{confetti(90);burst(c.left+c.width*.25,c.top,50)},400);
  setTimeout(()=>burst(c.right-c.width*.25,c.top+20,50),900);
  setTimeout(()=>burst(c.left+c.width/2,c.top-30,60),1400);
  setTimeout(()=>go(2),4000)}

/* thư */
const L=CFG.letters.map(fill),dots=$('#dots'),msg=$('#msg');let li=0,lock=false;
dots.innerHTML=L.map(()=>'<i></i>').join('');
function showLetter(i,first){li=i;const run=()=>{msg.textContent=L[i];msg.classList.remove('swap');$$('#dots i').forEach((d,k)=>d.classList.toggle('a',k===i));
    $('#tap').textContent=i===L.length-1?'chạm để nhận lời chúc cuối':'chạm bất kỳ đâu để đọc tiếp';
    if(i>0&&i%2===0)hearts(W/2,H*.7,6,60);lock=false};
  if(first){run();return}lock=true;msg.classList.add('swap');setTimeout(run,450)}
$('#s2').addEventListener('click',()=>{if(lock)return;if(li<L.length-1)showLetter(li+1);else go(3)});

/* kết */
$('#lan').onclick=()=>{for(let i=0;i<14;i++){const e=document.createElement('div');e.className='lantern';
  e.style.left=rnd(4,92)+'%';e.style.setProperty('--d',rnd(6.5,10)+'s');e.style.setProperty('--x',rnd(-50,50)+'px');
  e.style.animationDelay=(i*.22)+'s';e.style.transform='scale('+rnd(.7,1.2)+')';
  e.addEventListener('animationend',()=>e.remove());document.body.appendChild(e)}};
$('#again').onclick=()=>{lit=3;$$('.cd').forEach(g=>g.classList.remove('out'));$('#blow').style.display='';
  $('#hint').innerHTML='Nhắm mắt, ước một điều thật đẹp,<br>rồi chạm vào từng ngọn nến để thổi tắt.';go(1)};
$('#s3').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;hearts(e.clientX,e.clientY,7,18);if(Math.random()<.4)burst(e.clientX,e.clientY,28)});
</script>
